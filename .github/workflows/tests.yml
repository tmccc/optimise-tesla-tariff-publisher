name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: ${{ runner.temp }}
          OPTIMISE_TESLA_STATE_DIR: ${{ runner.temp }}/optimise-tesla-state
        run: python -m unittest discover -s tests -v
      - name: Run optional read-only companion tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/companions/customer_pricing:$GITHUB_WORKSPACE/companions/price_comparison:$GITHUB_WORKSPACE/companions/publisher_observer"
          python -m unittest discover -s companions/customer_pricing -p 'test_*.py' -v
          python -m unittest discover -s companions/price_comparison -p 'test_*.py' -v
          python -m unittest discover -s companions/publisher_observer -p 'test_*.py' -v
